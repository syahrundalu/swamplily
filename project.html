<script>
fetch('images-data.json?v=20260920-18',{cache:'no-store'}).then(r=>r.json()).then(data=>{
  const requested=Number(new URLSearchParams(location.search).get('project'));
  const index=Number.isInteger(requested)&&requested>=0&&requested<data.categories.length?requested:0;
  const category=data.categories[index];
  document.title=category.name+' — Swamp Lily';
  document.querySelector('#projectTitle').textContent=category.name;
  document.querySelector('#projectDescription').textContent=(category.descriptions||[]).find(Boolean)||'A study in botanical form, material, place, and the stories that grow between them.';
  document.querySelector('#projectCredit').textContent=(category.credits||[]).find(Boolean)||'';
  const gallery=document.querySelector('#projectImages');
  const galleryClasses=['project-gallery-featured','project-gallery-set-design','project-gallery-accessories','project-gallery-interior','project-gallery-pears','project-gallery-accounts','project-gallery-romantic'];
  if(galleryClasses[index]) gallery.classList.add(galleryClasses[index]);
  category.images.forEach((src,i)=>{
    const image=document.createElement('img');
    image.src=src;
    image.alt=category.name+' '+(i+1);
    image.loading=i>2?'lazy':'eager';
    image.decoding='async';
    gallery.append(image);
  });
}).catch(console.error)
</script></body></html>
