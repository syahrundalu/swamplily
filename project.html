<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project — Swamp Lily</title><link rel="icon" href="images/logo.PNG"><link rel="stylesheet" href="css/guideline.css"></head><body class="guideline">
<nav class="site-nav"><a href="index.html"><img src="images/logo.PNG" alt="Swamp Lily"></a><ul><li><a href="home.html">Home</a></li><li><a href="work.html">Work</a></li><li><a href="shop.html">Shop</a></li></ul></nav>
<main class="project-layout"><section class="project-copy"><div class="project-text"><h1 id="projectTitle"></h1><p id="projectDescription"></p><small id="projectCredit"></small></div><div class="project-images" id="projectImages"></div></section></main>
<script>fetch('images-data.json').then(r=>r.json()).then(data=>{const requested=Number(new URLSearchParams(location.search).get('project'));const index=Number.isInteger(requested)&&requested>=0&&requested<data.categories.length?requested:0;const category=data.categories[index];document.title=category.name+' — Swamp Lily';document.querySelector('#projectTitle').textContent=category.name;document.querySelector('#projectDescription').textContent=(category.descriptions||[]).find(Boolean)||'A study in botanical form, material, place, and the stories that grow between them.';document.querySelector('#projectCredit').textContent=(category.credits||[]).find(Boolean)||'';category.images.forEach((src,i)=>{const image=document.createElement('img');image.src=src;image.alt=category.name+' '+(i+1);image.loading=i>2?'lazy':'eager';image.decoding='async';document.querySelector('#projectImages').append(image)})}).catch(console.error)</script></body></html>
