<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Work — Swamp Lily</title>
  <link rel="icon" href="images/logo.PNG">
  <link rel="stylesheet" href="css/guideline.css">
</head>
<body class="guideline work-page">
  <nav class="site-nav work-nav">
    <a href="index.html"><img src="images/logo.PNG" alt="Swamp Lily"></a>
    <ul><li><a href="home.html">Home</a></li><li><a href="work.html">Work</a></li><li><a href="shop.html">Shop</a></li></ul>
  </nav>
  <main class="work-grid" id="workGrid" aria-label="Selected work"></main>
  <script>
    fetch('images-data.json').then(response=>response.json()).then(data=>{
      const grid=document.querySelector('#workGrid');
      const covers=[
        'images/Update/WORK/1/IRRF1124.JPG',
        'images/Update/WORK/2/0000006.jpg',
        'images/Update/WORK/3/1.jpg',
        'images/Update/WORK/4/2.jpg',
        'images/Update/WORK/5/FOLD-BC.jpg',
        'images/Update/WORK/6/7.jpg',
        'images/Update/WORK/7/AfterlightImage (1).JPG'
      ];
      const columns=[document.createElement('div'),document.createElement('div')];
      columns.forEach(column=>{column.className='work-column';grid.append(column)});
      data.categories.forEach((category,index)=>{
        const link=document.createElement('a');
        link.className='work-card work-card-'+(index+1);
        link.href='project.html?project='+index;
        link.setAttribute('aria-label','View '+category.name);
        const image=document.createElement('img');
        image.src=covers[index];
        image.alt=category.name;
        image.loading='eager';
        image.fetchPriority=index<2?'high':'auto';
        image.decoding='async';
        link.append(image);
        columns[index%2].append(link);
      });
    }).catch(console.error);
  </script>
</body>
</html>
