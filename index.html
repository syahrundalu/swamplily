<!doctype html><html lang="en"><head><title>Swamplily</title><script>document.documentElement.classList.remove('no-js');document.documentElement.classList.add('js');</script><meta charset="utf-8"><meta name="description" content="Discover Swamp Lily, where art meets nature."><meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no"><link rel="icon" href="images/logo.PNG"><link rel="stylesheet" href="css/vendor.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/mobile-style.css"><link rel="stylesheet" href="css/preloader.css"></head><body id="top">
<div id="page-preloader" class="page-preloader"><div id="loader"><img src="images/buaya_motion.GIF" alt=""></div></div><section><div class="banner" id="blurred-section"><div class="text-content text-white d-flex justify-content-center align-content-center" id="bannerbackground"><img src="images/logodancing.gif" alt="Swamp Lily" class="logodancing" id="logodancing" width="90%"></div><div class="container link-landing" id="logolanding"><div class="row"><ul><li><a href="home.html">Home</a></li><li><a href="work.html">Work</a></li><li><a href="shop.html">Shop</a></li></ul></div></div></div></section>
<script>
const bannerbackground=document.getElementById('bannerbackground'),logodancing=document.getElementById('logodancing'),logolanding=document.getElementById('logolanding');
function parallaxEffect(){
  const value=scrollY;
  bannerbackground.style.transform=`translateY(${value*.4}px)`;
  logodancing.style.transform=`translateY(${value*.4}px)`;
  logodancing.style.opacity=1-value*.001;
  logolanding.style.transform=innerWidth>768?`translateY(${value*-.09}px)`:'none';
}
let landingScrollActive=false;
function scrollToLandingLinks(){
  if(!matchMedia('(min-width: 769px)').matches)return;
  if(landingScrollActive)return;
  const links=logolanding.querySelector('ul');
  const start=scrollY;
  const destination=Math.max(0,links.getBoundingClientRect().top+start-(innerHeight-links.offsetHeight)/2);
  const distance=destination-start;
  const duration=10000;
  const startedAt=performance.now();
  const root=document.documentElement;
  const previousScrollBehavior=root.style.scrollBehavior;
  landingScrollActive=true;
  root.style.scrollBehavior='auto';
  function animate(now){
    const progress=Math.min((now-startedAt)/duration,1);
    const eased=progress*progress*progress*(progress*(progress*6-15)+10);
    scrollTo(0,start+distance*eased);
    if(progress<1){
      requestAnimationFrame(animate);
    }else{
      parallaxEffect();
      window.setTimeout(()=>{
        root.style.scrollBehavior=previousScrollBehavior;
        landingScrollActive=false;
      },350);
    }
  }
  requestAnimationFrame(animate);
}
logodancing.addEventListener('click',scrollToLandingLinks);
addEventListener('scroll',()=>requestAnimationFrame(parallaxEffect),{passive:true});
</script>
<script src="js/preloader.js"></script></body></html>
