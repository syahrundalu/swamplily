<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Home — Swamp Lily</title>
  <meta name="description" content="Swamp Lily is a botanical design studio based in Bali.">
  <link rel="icon" href="images/logo.PNG">
  <link rel="stylesheet" href="css/guideline.css?v=20260920-5">
  <link rel="stylesheet" href="css/preloader.css">
</head>
<body class="guideline home-page">
  <div class="page-preloader"><img src="images/buaya_motion.GIF" alt="" aria-hidden="true"></div>
  <main>
    <section class="home-split">
      <div class="home-hero-inner">
        <div class="home-slideshow">
          <img src="images/optimized/home/1.webp" alt="Botanical arrangement" fetchpriority="high">
        </div>
        <div class="home-panel">
          <nav class="home-nav" aria-label="Main navigation">
            <ul>
              <li><a href="home.html">Home</a></li>
              <li><a href="work.html">Work</a></li>
              <li><a href="shop.html">Shop</a></li>
            </ul>
          </nav>
          <div class="home-copy">
            <h1><img src="images/header/stage_for_everything_in_between.png" alt="A Stage for Everything in Between"></h1>
            <p>Swamp Lily is a floral design studio based in Bali. We create to tell stories through the fascinating lens of the botanical world, exploring the idea of alternative beauty—to create everything in between.</p>
          </div>
        </div>
      </div>
    </section>

    <section class="home-categories">
      <a class="category-card" href="shop.html#arrangements"><img src="images/optimized/Update/HOME/COVER/ARRANGEMENTS.webp" alt="Arrangements" loading="lazy" decoding="async"><span>ARRANGEMENTS</span></a>
      <a class="category-card" href="weddings.html"><img src="images/optimized/Update/HOME/COVER/IRRF1124.webp" alt="Weddings" loading="lazy" decoding="async"><span>WEDDINGS</span></a>
      <a class="category-card" href="styling.html"><img src="images/optimized/Update/HOME/COVER/STYLING &amp; CURATIONS.webp" alt="Styling and curation" loading="lazy" decoding="async"><span>STYLING &amp; CURATION</span></a>
    </section>
  </main>

  <footer class="site-footer home-footer">
    <a class="footer-logo" href="index.html" aria-label="Swamp Lily landing page"><img src="images/logodancing.gif" alt="Swamp Lily"></a>
    <div class="footer-socials">
      <a href="https://instagram.com/" aria-label="Instagram" title="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" class="icon-fill"/></svg></a>
      <a href="mailto:hello@swamplily.com" aria-label="Email" title="Email"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m4 7 8 6 8-6"/></svg></a>

    </div>
  </footer>
  <script>
    const files=['1.webp','2.webp','3.webp','4.webp','5.webp'];
    let current=0;
    const hero=document.querySelector('.home-slideshow img');
    setInterval(()=>{current=(current+1)%files.length;hero.classList.add('is-changing');setTimeout(()=>{hero.src='images/optimized/home/'+files[current];hero.classList.remove('is-changing')},300)},5000);
  </script>
  <script src="js/preloader.js"></script>
</body>
</html>
